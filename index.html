<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOM: Página Interativa com JavaScript</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(135deg, #6EC6FF 0%, #7B61FF 55%, #FF6FB5 100%);
    display: flex;
    justify-content: center;
    padding: 48px 20px;
  }

  .card {
    max-width: 620px;
    width: 100%;
    background: rgba(255, 255, 255, 0.16);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(255, 255, 255, 0.35);
    border-radius: 20px;
    padding: 36px 40px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.18);
    color: #1c1c1e;
  }

  h1 {
    font-size: 1.6rem;
    margin: 0 0 28px;
  }

  section {
    margin-bottom: 30px;
  }

  section:last-of-type {
    margin-bottom: 20px;
  }

  .btn {
    background: rgba(255, 255, 255, 0.35);
    border: 1px solid rgba(255, 255, 255, 0.55);
    border-radius: 10px;
    padding: 10px 18px;
    font-size: 0.95rem;
    cursor: pointer;
    color: #1c1c1e;
    transition: background 0.2s ease, transform 0.1s ease;
  }

  .btn:hover { background: rgba(255, 255, 255, 0.55); }
  .btn:active { transform: scale(0.97); }

  #contador {
    font-size: 1.4rem;
    font-weight: 600;
    margin-top: 14px;
  }

  input[type="text"], select {
    width: 100%;
    padding: 11px 14px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.55);
    background: rgba(255, 255, 255, 0.25);
    font-size: 0.95rem;
    color: #1c1c1e;
  }

  input::placeholder { color: rgba(28, 28, 30, 0.6); }

  #charCount {
    margin-top: 8px;
    font-size: 0.85rem;
    opacity: 0.85;
  }

  #paragrafos p {
    background: rgba(255, 255, 255, 0.22);
    border-radius: 10px;
    padding: 9px 14px;
    margin: 10px 0 0;
  }

  .list-row {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
  }

  .list-row select { flex: 1; }

  #listasContainer ul,
  #listasContainer ol {
    background: rgba(255, 255, 255, 0.22);
    border-radius: 10px;
    padding: 14px 16px 14px 36px;
    margin: 0 0 12px;
  }

  #resetBtn {
    background: rgba(255, 90, 90, 0.35);
    border-color: rgba(255, 90, 90, 0.5);
  }

  #resetBtn:hover { background: rgba(255, 90, 90, 0.5); }
</style>
</head>
<body>
  <div class="card">
    <h1>DOM: Página Interativa com JavaScript</h1>

    <section>
      <button class="btn" id="incBtn">Incrementar</button>
      <button class="btn" id="decBtn">Decrementar</button>
      <div id="contador">0</div>
    </section>

    <section>
      <input type="text" id="textoInput" placeholder="Digite algo... (Enter para adicionar)">
      <div id="charCount">0 caracteres</div>
      <div id="paragrafos"></div>
    </section>

    <section>
      <div class="list-row">
        <select id="tipoLista">
          <option value="ul">Lista Não Ordenada</option>
          <option value="ol">Lista Ordenada</option>
        </select>
        <button class="btn" id="addItemBtn">Adicionar Item</button>
      </div>
      <div id="listasContainer"></div>
    </section>

    <button class="btn" id="resetBtn">Resetar Tudo</button>
  </div>

<script>
  // --- Contador de cliques ---
  const incBtn = document.getElementById('incBtn');
  const decBtn = document.getElementById('decBtn');
  const contadorEl = document.getElementById('contador');
  let contador = 0;

  incBtn.addEventListener('click', () => {
    contador++;
    contadorEl.textContent = contador;
  });

  decBtn.addEventListener('click', () => {
    if (contador === 0) {
      alert('O contador já está em zero.');
      return;
    }
    contador--;
    contadorEl.textContent = contador;
  });

  // --- Texto dinâmico + contador de caracteres ---
  const textoInput = document.getElementById('textoInput');
  const charCount = document.getElementById('charCount');
  const paragrafos = document.getElementById('paragrafos');

  textoInput.addEventListener('input', () => {
    const semEspacos = textoInput.value.replace(/ /g, '');
    charCount.textContent = semEspacos.length + ' caracteres';
  });

  textoInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && textoInput.value.trim() !== '') {
      const p = document.createElement('p');
      p.textContent = textoInput.value;
      paragrafos.appendChild(p);
      textoInput.value = '';
      charCount.textContent = '0 caracteres';
    }
  });

  // --- Adicionar novo item (lista ordenada ou não ordenada) ---
  const tipoLista = document.getElementById('tipoLista');
  const addItemBtn = document.getElementById('addItemBtn');
  const listasContainer = document.getElementById('listasContainer');
  let ulEl = null;
  let olEl = null;

  addItemBtn.addEventListener('click', () => {
    const texto = prompt('Digite o texto do item:');
    if (!texto || texto.trim() === '') return;

    const li = document.createElement('li');
    li.textContent = texto;

    if (tipoLista.value === 'ul') {
      if (!ulEl) {
        ulEl = document.createElement('ul');
        listasContainer.appendChild(ulEl);
      }
      ulEl.appendChild(li);
    } else {
      if (!olEl) {
        olEl = document.createElement('ol');
        listasContainer.appendChild(olEl);
      }
      olEl.appendChild(li);
    }
  });

  // --- Reset geral ---
  const resetBtn = document.getElementById('resetBtn');
  resetBtn.addEventListener('click', () => {
    contador = 0;
    contadorEl.textContent = contador;
    textoInput.value = '';
    charCount.textContent = '0 caracteres';
    paragrafos.innerHTML = '';
    listasContainer.innerHTML = '';
    ulEl = null;
    olEl = null;
  });
</script>
</body>
</html>
